[package]
name = "quad9-desktop"
version = "0.1.0-dev"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
quad9-service = { path = "../../../crates/quad9-service" }
quad9-core = { path = "../../../crates/quad9-core" }
quad9-native = { path = "../../../crates/quad9-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# This independent workspace does not inherit the root release profile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
