name: Desktop UI

on:
  pull_request:
    paths: ['apps/desktop/**', 'crates/**', 'installer/windows/InstallerLifecycle.psm1', 'scripts/validation/*Startup*', 'scripts/validation/Measure-Quad9Resources.ps1', 'scripts/validation/*Resource*', 'scripts/validation/*Tray*', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'crates/**', 'installer/windows/InstallerLifecycle.psm1', 'scripts/validation/*Startup*', 'scripts/validation/Measure-Quad9Resources.ps1', 'scripts/validation/*Resource*', 'scripts/validation/*Tray*', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: node --test scripts/startup-options.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-browser-screenshots
          path: output/playwright/
          retention-days: 7
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --locked -- -D warnings
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --locked
      - name: Check native startup diagnostic retention
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --locked
      - name: Check per-user Windows startup tasks under both PowerShell editions
        run: |
          foreach ($validationShell in @('powershell.exe', 'pwsh.exe')) {
            & $validationShell -NoProfile -File scripts/validation/Test-WindowsStartup.ps1
            if ($LASTEXITCODE -ne 0) { throw "Windows startup regression failed under $validationShell" }
          }
      - name: Exercise the actual native window and Rust IPC without a service
        working-directory: apps/desktop
        run: node scripts/native-smoke.mjs src-tauri/target/debug/quad9-desktop.exe
      - name: Check native and document startup phase collection
        working-directory: apps/desktop
        run: node scripts/native-startup.mjs src-tauri/target/debug/quad9-desktop.exe 1
      - name: Check tray startup without creating a WebView
        working-directory: apps/desktop
        run: node scripts/native-tray-startup.mjs src-tauri/target/debug/quad9-desktop.exe
      - name: Validate native accessibility and tray window recreation
        working-directory: apps/desktop
        run: node scripts/native-validation.mjs src-tauri/target/debug/quad9-desktop.exe
      - name: Validate native resource counters under Windows PowerShell and PowerShell 7
        working-directory: apps/desktop
        run: node scripts/native-resources.mjs src-tauri/target/debug/quad9-desktop.exe ../../output/playwright/native-resources --desktop-only --counter-smoke --verify-pwsh --service-unavailable
      - name: Verify exited-process CPU accounting and scoped benchmark power requests
        run: |
          foreach ($validationShell in @('powershell.exe', 'pwsh.exe')) {
            & $validationShell -NoProfile -File scripts/validation/Test-ResourceJob.ps1
            if ($LASTEXITCODE -ne 0) { throw "CPU accounting regression failed under $validationShell" }
            & $validationShell -NoProfile -File scripts/validation/Test-ResourcePower.ps1
            if ($LASTEXITCODE -ne 0) { throw "Power request regression failed under $validationShell" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quad9-desktop-windows-development
          path: apps/desktop/src-tauri/target/debug/quad9-desktop.exe
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-native-screenshot
          path: output/playwright/native-service-unavailable.png
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-native-accessibility
          path: |
            output/playwright/native-validation/*.json
            output/playwright/native-validation/*.png
            output/playwright/native-resources/*.json
            output/playwright/native-startup/*.json
            output/playwright/native-tray-startup/*.json
          retention-days: 7
