name: Native DNS contract in disposable VMs

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Write and restore native settings in this disposable VM
        shell: pwsh
        run: ./scripts/validation/Test-NativeDnsContract.ps1
      - name: Restore saved baseline even when validation fails
        if: always()
        shell: pwsh
        run: ./scripts/validation/Test-NativeDnsContract.ps1 -RestoreOnly
